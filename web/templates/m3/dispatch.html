<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理派单 · 校园资源服务平台</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/m3/orders.css">
  <link rel="stylesheet" href="/assets/m3/dispatch.css">
  <script src="/assets/m3/time.js" defer></script>
  <script src="/assets/m3/dispatch.js" defer></script>
</head>
<body>
  <main id="dispatch-page" class="page m3-orders m3-dispatch" data-login-available="{{LOGIN_AVAILABLE}}">
    <nav aria-label="报修导航"><a href="/m3/report">新建房间报修</a><a href="/m3/my-orders">我的工单</a></nav>
    <p class="eyebrow">M3 · 物业报修</p>
    <h1>管理派单</h1>
    <p class="intro">当前仅支持房间报修。将已报修工单指派给具有维修资格的人员；已派单及维修中工单只供查询。</p>
    <p id="dispatch-message" class="orders-message" role="status" aria-live="polite">正在加载管理队列与维修人员…</p>
    <a id="dispatch-login" href="/m2/login" hidden>前往登录</a>
    <a id="assignment-detail" hidden>打开工单详情核对</a>
    <section class="module" aria-labelledby="queue-title">
      <h2 id="queue-title">工单队列</h2>
      <label for="dispatch-status">工单状态</label>
      <select id="dispatch-status"><option value="REPORTED">已报修</option><option value="ASSIGNED">已派单</option><option value="IN_REPAIR">维修中</option></select>
      <button id="reload-dispatch" type="button">刷新队列与候选</button>
      <p id="queue-message" role="status"></p>
      <div id="dispatch-content"></div>
    </section>
    <section class="module" aria-labelledby="assignment-title">
      <h2 id="assignment-title">选择工单与受理人</h2>
      <form id="assignment-form">
        <fieldset id="assignment-fields" disabled>
          <legend>手动派单</legend>
          <label for="dispatch-order">待派工单</label><select id="dispatch-order" required></select>
          <label for="assigned-to">维修人员</label><select id="assigned-to" required></select>
          <p id="repairers-message" role="status"></p>
          <button id="submit-assignment" type="submit">确认派单</button>
        </fieldset>
      </form>
      <noscript><p>请启用 JavaScript 以读取队列和派单；未启用时表单保持禁用。</p></noscript>
    </section>
    <footer><p>时间以北京时间显示。结果不明时请打开详情核实，不要重复提交。本页面不提供重新派单或开始维修。</p></footer>
  </main>
</body>
</html>
